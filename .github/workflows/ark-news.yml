
name: ARK News Discord

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: ark-news
  cancel-in-progress: false

jobs:
  ark-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests deep-translator

      - name: ARK News abrufen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_DISCORD: "1"
        run: python ark_news.py

      - name: Nachrichtenstand speichern
        run: |
          if [ -f ark_news_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ark_news_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update ARK news state"
              git push
            fi
          fi
